<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>応用情報 単語帳</title>
<style>
:root{--bg:#eef2f1;--card:#fff;--fg:#17211e;--muted:#5f6d68;--line:#d6dedb;--line2:#9aa8a3;--accent:#1f6b52;--box:#f3f6f5;--hl:#fff2c7;--gap:#f3c9c0;--ok:#22804f;--ng:#b5432f;--star:#d99a00}
@media (prefers-color-scheme:dark){:root{--bg:#111715;--card:#1a2220;--fg:#e6eeeb;--muted:#9db0a9;--line:#2c3834;--line2:#5b6d67;--accent:#5cc49a;--box:#232d2a;--hl:#4a4126;--gap:#5a2f28;--ok:#3fb27a;--ng:#e2735f;--star:#f2c14e;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,select{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:16px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:100%}
select,button{font:inherit}
select{width:100%;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:44px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:1;min-width:0;font-size:13px;padding:8px 4px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--fg);min-height:38px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.stat{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:46vh;overflow-wrap:anywhere}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.unit{font-size:12px;color:var(--muted)}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.ok{color:var(--ok);border-color:var(--ok)}.badge.ng{color:var(--ng);border-color:var(--ng)}
.star{background:none;border:none;font-size:26px;line-height:1;color:var(--line2);cursor:pointer;padding:0 2px;min-width:44px;min-height:44px}
.star[aria-pressed="true"]{color:var(--star)}
.kind{font-size:12px;color:var(--accent);font-weight:700}
.q{font-size:clamp(22px,6.5vw,30px);font-weight:700;line-height:1.35}
.q.long{font-size:18px}
.img svg{width:100%;height:auto;display:block;background:var(--box);border-radius:10px;padding:6px}
.ans{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.ans b{display:block;font-size:12px;color:var(--muted);font-weight:600}
.ans p{margin:2px 0 0;line-height:1.6;white-space:pre-line}
.show{margin-top:auto;font-size:16px;font-weight:700;min-height:52px;border-radius:12px;border:2px dashed var(--line2);background:transparent;color:var(--fg);cursor:pointer}
.dock{position:sticky;bottom:0;background:var(--bg);padding:8px 0 calc(6px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rev{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.rev button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer}
.rev .main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.card{cursor:pointer}
.hint{margin-top:auto;text-align:center;font-size:12px;color:var(--muted)}
.btns button{min-height:56px;border-radius:12px;border:none;color:#fff;font-size:17px;font-weight:700;cursor:pointer}
.bng{background:var(--ng)}.bok{background:var(--ok)}
.nav{display:flex;justify-content:space-between;gap:10px}
.nav button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.empty{margin:auto;text-align:center;color:var(--muted);line-height:1.8}
button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <select id="unit" aria-label="単元"></select>
  <div class="chips" role="group" aria-label="絞り込み">
    <button class="chip" data-f="all">すべて</button>
    <button class="chip" data-f="new">未学習</button>
    <button class="chip" data-f="ng">前回不正解</button>
    <button class="chip" data-f="star">★印</button>
  </div>
  <div class="stat"><span id="pos"></span><span id="tally"></span></div>
  <div class="bar" id="bar"></div>
  <div class="card" id="card"></div>
  <div class="dock">
    <div class="rev" id="rev"><button id="prev" aria-label="前のカード">←</button><button class="main" id="showBtn">答えを見る</button><button id="next" aria-label="次のカード">→</button></div>
    <div class="btns" id="btns" hidden><button class="bng" id="bNg">不正解</button><button class="bok" id="bOk">正解</button></div>
  </div>
</div>

-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(A)<\/text><rect x=\"130\" y=\"58\" width=\"100\" height=\"34\" rx=\"6\" fill=\"var(--hl)\" stroke=\"var(--line2)\"/><text x=\"180.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(B)<\/text><rect x=\"250\" y=\"58\" width=\"100\" height=\"34\" rx=\"6\" fill=\"var(--hl)\" stroke=\"var(--line2)\"/><text x=\"300.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(C)<\/text><rect x=\"250\" y=\"106\" width=\"100\" height=\"34\" rx=\"6\" fill=\"var(--box)\" stroke=\"var(--line2)\"/><text x=\"300.0\" y=\"128.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">ディスク<\/text><line x1=\"60\" y1=\"44\" x2=\"60\" y2=\"58\" stroke=\"var(--fg)\" marker-end=\"url(#ar)\"/><line x1=\"110\" y1=\"75\" x2=\"130\" y2=\"75\" stroke=\"var(--fg)\" marker-end=\"url(#ar)\"/><line x1=\"230\" y1=\"75\" x2=\"250\" y2=\"75\" stroke=\"var(--fg)\" marker-end=\"url(#ar)\"/><line x1=\"300\" y1=\"92\" x2=\"300\" y2=\"106\" stroke=\"var(--fg)\" marker-end=\"url(#ar)\"/><\/svg>", "a": [{"h": "(A) 外部スキーマ", "v": "利用者からの見え方。例：ビュー"}, {"h": "(B) 概念スキーマ", "v": "論理的な全体設計。例：表定義、E-R図、正規化、一意性制約・参照制約"}, {"h": "(C) 内部スキーマ", "v": "物理的な格納方法。例：インデックス、ファイル編成"}], "g": "テクノロジ", "id": "b1512e08b7"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "外部スキーマ", "k": "層", "a": [{"h": "何を定義するか", "v": "利用者・アプリケーションごとに必要なデータの見方"}, {"h": "リレーショナルDBでの例", "v": "ビュー、表示する列や行"}], "sub": "", "g": "テクノロジ", "id": "8380db7e75"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "概念スキーマ", "k": "層", "a": [{"h": "何を定義するか", "v": "データベース全体の論理的な構造・意味"}, {"h": "リレーショナルDBでの例", "v": "表、列、表間の関係。ER図、表定義、正規化"}], "sub": "", "g": "テクノロジ", "id": "34b89371fe"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "内部スキーマ", "k": "層", "a": [{"h": "何を定義するか", "v": "データを記憶装置にどう格納し、どうアクセスするか"}, {"h": "リレーショナルDBでの例", "v": "ファイル編成、記憶領域、インデックス"}], "sub": "", "g": "テクノロジ", "id": "b207ca9a50"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "ファイル編成、インデックスの設定", "k": "設計作業・目的", "a": [{"h": "対応する層・分野", "v": "内部スキーマ"}], "sub": "", "g": "テクノロジ", "id": "df3e5502a8"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "エンティティ間の関係を表すE-Rモデルの作成", "k": "設計作業・目的", "a": [{"h": "対応する層・分野", "v": "概念スキーマ"}], "sub": "", "g": "テクノロジ", "id": "0798fc6449"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "一意性制約・参照制約の設定", "k": "設計作業・目的", "a": [{"h": "対応する層・分野", "v": "概念スキーマ上の整合性制約"}], "sub": "", "g": "テクノロジ", "id": "98894156c6"}, {"u": "データベースのスキーマ（ANSI/SPARC 3層スキーマ）", "q": "冗長性を抑えるための正規化", "k": "設計作業・目的", "a": [{"h": "対応する層・分野", "v": "概念スキーマの論理設計"}], "sub": "", "g": "テクノロジ", "id": "bc125f9a5c"}, {"u": "リレーショナルデータベースのキー", "q": "スーパキー（superkey）", "k": "キー", "a": [{"h": "英語の意味", "v": "super＝上位の、key＝鍵"}, {"h": "定義・関係", "v": "行を一意に識別できる属性の組。余分な属性を含んでもよい。"}], "sub": "", "g": "テクノロジ", "id": "01e237b0fe"}, {"u": "リレーショナルデータベースのキー", "q": "候補キー（candidate key）", "k": "キー", "a": [{"h": "英語の意味", "v": "candidate＝候補"}, {"h": "定義・関係", "v": "行を一意に識別できる最小の属性の組。スーパキーから余分な属性を除いたもの。"}], "sub": "", "g": "テクノロジ", "id": "69ce9621a9"}, {"u": "リレーショナルデータベースのキー", "q": "主キー（primary key）", "k": "キー", "a": [{"h": "英語の意味", "v": "primary＝主要な"}, {"h": "定義・関係", "v": "候補キーのうち、表の代表として選んだもの。"}], "sub": "", "g": "テクノロジ", "id": "db9b967bc1"}, {"u": "リレーショナルデータベースのキー", "q": "代替キー（alternate key）", "k": "キー", "a": [{"h": "英語の意味", "v": "alternate＝代わりの"}, {"h": "定義・関係", "v": "候補キーのうち、主キーに選ばれなかったもの。"}], "sub": "", "g": "テクノロジ", "id": "3e0a42b721"}, {"u": "リレーショナルデータベースのキー", "q": "外部キー（foreign key）", "k": "キー", "a": [{"h": "英語の意味", "v": "foreign＝別の表の、外部の"}, {"h": "定義・関係", "v": "他表のキーを参照し、表間の関連と参照整合性を保つ属性の組。"}], "sub": "", "g": "テクノロジ", "id": "b6165f1e9d"}, {"u": "リレーショナルデータベースのキー", "q": "複合キー（composite key）", "k": "キー", "a": [{"h": "英語の意味", "v": "composite＝複合の"}, {"h": "定義・関係", "v": "複数の属性を組み合わせて行を識別するキー。候補キーや主キーにもなり得る。"}], "sub": "", "g": "テクノロジ", "id": "cfba11c018"}, {"u": "SQL", "q": "原子性（Atomicity）", "k": "特性", "a": [{"h": "英語の意味", "v": "原子的であること"}, {"h": "内容", "v": "すべて実行するか、すべて取り消す。"}], "sub": "トランザクションとACID特性", "g": "テクノロジ", "id": "553fd74122"}, {"u": "SQL", "q": "一貫性（Consistency）", "k": "特性", "a": [{"h": "英語の意味", "v": "整合性"}, {"h": "内容", "v": "制約を満たす状態から、制約を満たす状態へ移る。"}], "sub": "トランザクションとACID特性", "g": "テクノロジ", "id": "cf76e07521"}, {"u": "SQL", "q": "独立性（Isolation）", "k": "特性", "a": [{"h": "英語の意味", "v": "分離"}, {"h": "内容", "v": "同時実行でも、各トランザクションが他の途中状態に不適切に干渉しない。直列化可能性では、並行実行の結果が何らかの直列実行と同等になる。"}], "sub": "トランザクションとACID特性", "g": "テクノロジ", "id": "69bfcbc350"}, {"u": "SQL", "q": "耐久性（Durability）", "k": "特性", "a": [{"h": "英語の意味", "v": "永続性"}, {"h": "内容", "v": "正常終了（コミット）した結果が、障害後も失われない。"}], "sub": "トランザクションとACID特性", "g": "テクノロジ", "id": "c7319bb265"}, {"u": "SQL", "q": "CASCADE", "k": "動作", "a": [{"h": "英単語の意味", "v": "連鎖する"}, {"h": "参照先の削除・更新時", "v": "削除なら対応する子表の行も削除し、更新なら子表の外部キー値も連動して更新する。"}], "sub": "外部キーと参照動作", "g": "テクノロジ", "id": "cae3aaca92"}, {"u": "SQL", "q": "RESTRICT", "k": "動作", "a": [{"h": "英単語の意味", "v": "制限する、禁止する"}, {"h": "参照先の削除・更新時", "v": "参照中の親行に対する削除・更新を直ちに拒否する。"}], "sub": "外部キーと参照動作", "g": "テクノロジ", "id": "c745b63461"}, {"u": "SQL", "q": "NO ACTION", "k": "動作", "a": [{"h": "英単語の意味", "v": "何もしない"}, {"h": "参照先の削除・更新時", "v": "参照整合性に違反する操作を拒否する。通常は制約確認時に判定するため、遅延可能な制約ではRESTRICTと確認時点が異なる。"}], "sub": "外部キーと参照動作", "g": "テクノロジ", "id": "8807463aa4"}, {"u": "SQL", "q": "SET NULL", "k": "動作", "a": [{"h": "英単語の意味", "v": "NULLに設定する"}, {"h": "参照先の削除・更新時", "v": "子表の外部キーをNULL（値がない状態）にする。列がNULLを許す必要がある。"}], "sub": "外部キーと参照動作", "g": "テクノロジ", "id": "d5f69d66db"}, {"u": "SQL", "q": "SET DEFAULT", "k": "動作", "a": [{"h": "英単語の意味", "v": "既定値に設定する"}, {"h": "参照先の削除・更新時", "v": "子表の外部キーを既定値にする。既定値が参照整合性を満たす必要がある。"}], "sub": "外部キーと参照動作", "g": "テクノロジ", "id": "f02bc32eee"}, {"u": "NoSQLデータベース", "q": "キー・バリュー型（key-value）", "k": "種類", "a": [{"h": "英語の意味・構造", "v": "key＝鍵、value＝値。キーと値を対応づける。"}, {"h": "特徴", "v": "単純なキー検索が速い。値の内部構造を問わず保存しやすい。"}], "sub": "", "g": "テクノロジ", "id": "4e5d4f246b"}, {"u": "NoSQLデータベース", "q": "カラム指向型（column-family）", "k": "種類", "a": [{"h": "英語の意味・構造", "v": "column＝列。行キーに対して列名と値を対応づける。"}, {"h": "特徴", "v": "行ごとに異なる列を持てるなど、柔軟に大量データを扱える。"}], "sub": "", "g": "テクノロジ", "id": "b62be52dfe"}, {"u": "NoSQLデータベース", "q": "ドキュメント指向型（document）", "k": "種類", "a": [{"h": "英語の意味・構造", "v": "document＝文書。JSONやXMLなどの文書形式で保存する。"}, {"h": "特徴", "v": "1件ごとに異なる項目や階層構造を持つデータに向く。"}], "sub": "", "g": "テクノロジ", "id": "8c913ea45c"}, {"u": "NoSQLデータベース", "q": "グラフ指向型（graph）", "k": "種類", "a": [{"h": "英語の意味・構造", "v": "graph＝グラフ。データを頂点と辺で表す。"}, {"h": "特徴", "v": "データ同士の複雑なつながりをたどる処理に向く。"}], "sub": "", "g": "テクノロジ", "id": "fe99d714e8"}, {"u": "NoSQLデータベース", "q": "オブジェクト指向データベース（object-oriented database）", "k": "用語", "a": [{"h": "役割", "v": "オブジェクトやクラス、継承など、オブジェクト指向の概念でデータを管理する。NoSQLの4分類とは別の分類。"}], "sub": "", "g": "テクノロジ", "id": "2d9356b96a"}, {"u": "NoSQLデータベース", "q": "データウェアハウス（data warehouse）", "k": "用語", "a": [{"h": "役割", "v": "意思決定・分析のため、主題別に整理した現在・過去のデータを蓄積する。データベースの用途・基盤を指す。"}], "sub": "", "g": "テクノロジ", "id": "ab674a05ba"}, {"u": "NoSQLデータベース", "q": "データディクショナリ（data dictionary）／リポジトリ（repository）", "k": "用語", "a": [{"h": "役割", "v": "データ項目の名称・形式・意味など、データに関する定義情報（メタデータ）を管理する。"}], "sub": "", "g": "テクノロジ", "id": "94d081d936"}, {"u": "データウェアハウスとスター・スキーマ", "q": "スター・スキーマの中心（A）と周り（B）のテーブルの名前は？", "img": "<svg viewBox=\"0 0 360 150\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0,0L10,5L0,10z\" fill=\"var(--fg)\"/><\/marker><\/defs><rect x=\"130\" y=\"50\" width=\"100\" height=\"50\" rx=\"6\" fill=\"var(--hl)\" stroke=\"var(--line2)\"/><text x=\"180.0\" y=\"80.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(A) 注文<\/text><rect x=\"10\" y=\"8\" width=\"100\" height=\"40\" rx=\"6\" fill=\"var(--box)\" stroke=\"var(--line2)\"/><text x=\"60.0\" y=\"33.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(B) 顧客<\/text><line x1=\"60\" y1=\"28\" x2=\"180\" y2=\"75\" stroke=\"var(--line2)\"/><rect x=\"250\" y=\"8\" width=\"100\" height=\"40\" rx=\"6\" fill=\"var(--box)\" stroke=\"var(--line2)\"/><text x=\"300.0\" y=\"33.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(B) 商品<\/text><line x1=\"300\" y1=\"28\" x2=\"180\" y2=\"75\" stroke=\"var(--line2)\"/><rect x=\"10\" y=\"100\" width=\"100\" height=\"40\" rx=\"6\" fill=\"var(--box)\" stroke=\"var(--line2)\"/><text x=\"60.0\" y=\"125.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(B) 販売店<\/text><line x1=\"60\" y1=\"120\" x2=\"180\" y2=\"75\" stroke=\"var(--line2)\"/><rect x=\"250\" y=\"100\" width=\"100\" height=\"40\" rx=\"6\" fill=\"var(--box)\" stroke=\"var(--line2)\"/><text x=\"300.0\" y=\"125.0\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--fg)\">(B) 日付<\/text><line x1=\"300\" y1=\"120\" x2=\"180\" y2=\"75\" stroke=\"var(--line2)\"/><\/svg>", "a": [{"h": "(A)", "v": "ファクトテーブル：売上・注文などの数値データ（分析の対象）と、周りの表を参照するキーを持つ"}, {"h": "(B)", "v": "ディメンションテーブル：顧客・商品など分析の切り口になるマスタデータ"}], "g": "テクノロジ", "id": "1834673c60"}, {"u": "データウェアハウスとスター・スキーマ", "q": "ファクトテーブル（fact table、事実表）", "k": "", "a": [{"h": "", "v": "分析対象となる取引・出来事を記録する中心の表。売上数量や金額などの数値（メジャー）と、各ディメンションを参照する外部キーを持つ。"}], "sub": "", "g": "テクノロジ", "id": "bc4afba1a1"}, {"u": "データウェアハウスとスター・スキーマ", "q": "ディメンションテーブル（dimension table、次元表）", "k": "", "a": [{"h": "", "v": "分析の切り口となる説明的な属性・マスターデータを持つ。例：顧客、商品、店舗、日付。"}], "sub": "", "g": "テクノロジ", "id": "4ee40e62b1"}, {"u": "データウェアハウスとスター・スキーマ", "q": "サマリーテーブル（summary table、集計表）", "k": "混同しやすい表", "a": [{"h": "役割", "v": "あらかじめ集計した結果を保存し、繰り返し行う分析・検索を速くする。"}], "sub": "", "g": "テクノロジ", "id": "af5ceeb0a0"}, {"u": "データウェアハウスとスター・スキーマ", "q": "ルックアップテーブル（lookup table、参照表）", "k": "混同しやすい表", "a": [{"h": "役割", "v": "コードと名称など、事前定義された値の一覧を保存する。"}], "sub": "", "g": "テクノロジ", "id": "6ee63b02a2"}, {"u": "分散データベースの透過性", "q": "位置に対する透過性（location transparency）", "k": "透過性", "a": [{"h": "意味", "v": "データベースがどの場所に配置されているかを意識せずに利用できる。"}], "sub": "", "g": "テクノロジ", "id": "ac0f21c16a"}, {"u": "分散データベースの透過性", "q": "移動に対する透過性（migration transparency）", "k": "透過性", "a": [{"h": "意味", "v": "データの格納場所が変更されても、アプリケーションや操作方法に影響しない。"}], "sub": "", "g": "テクノロジ", "id": "a4bb0cff73"}, {"u": "分散データベースの透過性", "q": "分割に対する透過性（fragmentation transparency）", "k": "透過性", "a": [{"h": "意味", "v": "データが複数サイトに分割して格納されていても、ひとつのデータとして利用できる。"}], "sub": "", "g": "テクノロジ", "id": "aa722ce058"}, {"u": "分散データベースの透過性", "q": "複製に対する透過性（replication transparency）", "k": "透過性", "a": [{"h": "意味", "v": "同じデータが複数サイトに複製されていても、複製を意識せずに利用できる。"}], "sub": "", "g": "テクノロジ", "id": "44545d12a9"}, {"u": "分散データベースの透過性", "q": "障害に対する透過性（failure transparency）", "k": "透過性", "a": [{"h": "意味", "v": "あるサイトに障害が発生しても、利用者が障害を意識せずに利用できる。"}], "sub": "", "g": "テクノロジ", "id": "0c5e2aa3b5"}, {"u": "分散データベースの透過性", "q": "データモデルに対する透過性（data model transparency）", "k": "透過性", "a": [{"h": "意味", "v": "各サイトのDBMSが異なるデータモデルを扱っていても、その違いを意識せずに利用できる。"}], "sub": "", "g": "テクノロジ", "id": "dbff6a86eb"}, {"u": "DAとDBA", "q": "DA（Data Administrator：データ管理者）", "k": "役割", "a": [{"h": "試験のキーワード", "v": "データの概念設計・論理設計"}], "sub": "", "g": "テクノロジ", "id": "63a81bb6ca"}, {"u": "DAとDBA", "q": "DBA（Database Administrator：データベース管理者）", "k": "役割", "a": [{"h": "試験のキーワード", "v": "DBの物理設計・構築・運用保守"}], "sub": "", "g": "テクノロジ", "id": "5447a7c265"}, {"u": "障害・欠陥の分析手法", "q": "FTA", "k": "手法", "a": [{"h": "略語の意味", "v": "Fault Tree Analysis：故障の木解析"}, {"h": "試験での見分け方", "v": "システムの障害から原因をAND・ORで樹形図に展開。トップダウン"}], "sub": "", "g": "テクノロジ", "id": "fdc7055283"}, {"u": "障害・欠陥の分析手法", "q": "FMEA", "k": "手法", "a": [{"h": "略語の意味", "v": "Failure Mode and Effects Analysis：故障モード影響解析"}, {"h": "試験での見分け方", "v": "部品ごとの故障モードからシステムへの影響を分析。ボトムアップ"}], "sub": "", "g": "テクノロジ", "id": "a4ce3cf9c2"}, {"u": "障害・欠陥の分析手法", "q": "RCA", "k": "手法", "a": [{"h": "略語の意味", "v": "Root Cause Analysis：根本原因分析"}, {"h": "試験での見分け方", "v": "なぜなぜ分析などで問題の根本原因を明らかにする"}], "sub": "", "g": "テクノロジ", "id": "581ed1f566"}, {"u": "障害・欠陥の分析手法", "q": "ODC分析", "k": "手法", "a": [{"h": "略語の意味", "v": "Orthogonal Defect Classification：直交欠陥分類"}, {"h": "試験での見   h+=`<div class="q${c.q.length>14?' long':''}">${esc(c.q)}</div>`;
  if(c.img)h+=`<div class="img">${c.img}</div>`;
  if(shown)h+='<div class="ans">'+c.a.map(x=>`<div>${x.h?`<b>${esc(x.h)}</b>`:''}<p>${esc(x.v)}</p></div>`).join('')+'</div>';
  else h+='<div class="hint">カードをタップしても答えが出ます</div>';
  el.innerHTML=h;
  $('star').onclick=e=>{e.stopPropagation();if(st.star[c.id])delete st.star[c.id];else st.star[c.id]=1;save();render()};
  el.onclick=()=>{if(!shown){shown=true;render()}};
}
function answer(ok){const c=deck[idx];if(!c)return;st.res[c.id]=ok?'ok':'ng';save();go(1);fillSelect()}
function go(d){idx=Math.max(0,Math.min(deck.length,idx+d));shown=false;render();window.scrollTo(0,0)}
$('bOk').onclick=()=>answer(true);$('bNg').onclick=()=>answer(false);
$('prev').onclick=()=>go(-1);$('showBtn').onclick=()=>{shown=true;render()};$('next').onclick=()=>go(1);
$('unit').onchange=e=>{st.unit=e.target.value;st.cur=null;save();build(false)};
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.filter=b.dataset.f;save();build(true)});
fillSelect();build(true);
</script>
</body>
</html>
